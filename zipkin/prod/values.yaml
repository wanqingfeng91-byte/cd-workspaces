replicaCount: 2

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/path: /metrics # 指标暴露的HTTP Path。
  prometheus.io/port: "8280" # 指标暴露端口。
  prometheus.io/scrape: "true" # 是否抓取当前Pod的指标。

podLabels: {}

podSecurityContext: {}

securityContext: {}


service:
  type: ClusterIP
  # This sets the orts more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  # port: 80
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
  - name: gateway
    sectionName: http
  hostnames:
  - chart-example.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers

resources: 
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 1000m
    memory: 1024Mi

livenessProbe:
  httpGet:
    path: /livez
    port: http
readinessProbe:
  httpGet:
    path: /readyz
    port: http
startupProbe:
  httpGet:
    path: /livez
    port: http
  initialDelaySeconds: 15  # 容器启动 15 秒后再开始检测
  periodSeconds: 5
  failureThreshold: 12     # 允许尝试 12 次（给足约 75 秒启动窗口）

command: 
# - java

args: 
# - -jar
# - /app/app.jar
# - --spring.profiles.active=prod

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 30
  targetCPUUtilizationPercentage: 80

# 容器生命周期钩子配置
lifecycle: 
  # preStop:
  #   exec:
  #     command: ["/bin/sh", "-c", "sleep 15"]
  # postStart:
  #   exec:
  #     command: ["/bin/sh", "-c", "echo Container started"]

terminationGracePeriodSeconds: 30


nodeSelector: {}

tolerations: []

# 同一 Helm Release 的 Pod 软反亲和性。
# 调度器会尽量将 Pod 分散到不同节点；节点不足时仍允许调度到同一节点。
# 当 affinity 非空时，下面的默认规则不会渲染，由 affinity 完整接管调度亲和性。
podAntiAffinity:
  enabled: true
  weight: 100
  topologyKey: kubernetes.io/hostname

# 完整自定义 affinity；非空时覆盖上面的默认 podAntiAffinity。
affinity: {}

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# 新 Pod 持续 Ready 多久后才视为可用。
minReadySeconds: 10

# Deployment 在多少秒没有推进后标记为 ProgressDeadlineExceeded。
progressDeadlineSeconds: 600

# 保留的历史 ReplicaSet 数量，用于查看历史和回滚。
revisionHistoryLimit: 5